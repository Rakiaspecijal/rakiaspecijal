<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Rakia Specijal – premium rakije i voćni likeri iz Srbije."
  >

  <title>Rakia Specijal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="age-locked">

  <!-- PROVERA GODINA -->
  <div class="age-gate" id="ageGate">

    <div class="age-card">

      <img
        src="logo.png"
        alt="Rakia Specijal logo"
        class="age-logo"
      >

      <p
        class="age-kicker"
        data-sr="Samo za punoletne"
        data-en="Adults only"
      >
        Samo za punoletne
      </p>

      <h1
        class="age-title"
        data-sr="Da li imate 18 ili više godina?"
        data-en="Are you 18 years of age or older?"
      >
        Da li imate 18 ili više godina?
      </h1>

      <p
        class="age-text"
        data-sr="Ovaj sajt sadrži informacije o alkoholnim pićima i namenjen je isključivo punoletnim osobama."
        data-en="This website contains information about alcoholic beverages and is intended only for adults."
      >
        Ovaj sajt sadrži informacije o alkoholnim pićima i namenjen je
        isključivo punoletnim osobama.
      </p>

      <div class="age-actions">

        <button
          type="button"
          class="age-button accept"
          id="acceptAge"
          data-sr="Imam 18+"
          data-en="I am 18+"
        >
          Imam 18+
        </button>

        <button
          type="button"
          class="age-button exit"
          id="exitAge"
          data-sr="Napusti sajt"
          data-en="Exit website"
        >
          Napusti sajt
        </button>

      </div>

    </div>
  </div>


  <!-- HEADER -->
  <header class="site-header" id="siteHeader">

    <nav class="navigation">

      <a
        href="#home"
        class="brand-logo"
        aria-label="Rakia Specijal"
      >
        <img src="logo.png" alt="Rakia Specijal">
      </a>

      <ul class="nav-links" id="navLinks">

        <li>
          <a href="#home" data-sr="Početna" data-en="Home">
            Početna
          </a>
        </li>

        <li>
          <a href="#story" data-sr="Naša priča" data-en="Our story">
            Naša priča
          </a>
        </li>

        <li>
          <a href="#products" data-sr="Proizvodi" data-en="Products">
            Proizvodi
          </a>
        </li>

        <li>
          <a
            href="#liqueurs"
            data-sr="Lepša polovina"
            data-en="Lepša polovina"
          >
            Lepša polovina
          </a>
        </li>
